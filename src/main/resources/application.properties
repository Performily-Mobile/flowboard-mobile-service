spring.application.name=Flowboard Platform

spring.profiles.default=dev

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.naming.physical-strategy=com.performily.flowboard.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

documentation.application.description=@project.description@
documentation.application.version=@project.version@

spring.messages.basename=messages
spring.messages.encoding=UTF-8

# IAM: provide a strong secret through the environment, especially in production.
iam.jwt.secret=${IAM_JWT_SECRET:}
iam.jwt.ttl-seconds=${IAM_JWT_TTL_SECONDS:28800}
# Disabled by default: enable explicitly to provision existing employees in local development.
iam.seed.enabled=${IAM_SEED_ENABLED:false}
iam.seed.default-password=${IAM_SEED_DEFAULT_PASSWORD:}
# Optional browser origins; native Android clients are not subject to CORS.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Flyway applies the mobile-only IAM schema adjustment before Hibernate starts.
# Existing nonempty development databases without migration history are baselined at 0,
# so V1 still runs. No changes are needed to the shared web seed SQL.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
